<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#f7f6f1" />
  <title>folio — your first portfolio, made simple</title>
  <style>
    :root {
      --paper: #f7f6f1;
      --paper-deep: #efeee7;
      --surface: #fffefa;
      --ink: #252d29;
      --muted: #69736d;
      --quiet: #929a94;
      --line: #e4e5dc;
      --line-dark: #d6d9cf;
      --green: #365d4a;
      --green-dark: #284a39;
      --green-soft: #e8efe9;
      --apricot: #c8795d;
      --apricot-soft: #f5e9e0;
      --blue-soft: #e9eef1;
      --shadow: 0 24px 70px rgba(40, 55, 46, .08);
      --shadow-soft: 0 8px 28px rgba(40, 55, 46, .055);
      --serif: "Iowan Old Style", "Baskerville", "Palatino Linotype", Georgia, serif;
      --sans: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color-scheme: light;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--sans); -webkit-font-smoothing: antialiased; }
    button, input, textarea, select { font: inherit; }
    button { cursor: pointer; }
    a { color: inherit; }
    .hidden { display: none !important; }
    .serif { font-family: var(--serif); font-weight: 400; }
    .eyebrow { color: var(--green); font-size: 10px; line-height: 1.3; font-weight: 750; text-transform: uppercase; letter-spacing: .14em; }
    .logo { display: inline-flex; align-items: center; gap: 9px; color: var(--ink); font-size: 20px; letter-spacing: -.06em; font-weight: 760; text-decoration: none; }
    .logo-mark { width: 25px; height: 25px; display: inline-grid; place-items: center; color: #fff; background: var(--green); border-radius: 8px 8px 8px 3px; transform: rotate(-4deg); }
    .logo-mark svg { width: 15px; height: 15px; transform: rotate(4deg); }
    .topbar { height: 74px; display: flex; align-items: center; justify-content: space-between; padding: 0 clamp(22px, 6vw, 88px); border-bottom: 1px solid rgba(42, 54, 47, .08); background: rgba(247,246,241,.86); position: relative; z-index: 5; }
    .nav-links { display: flex; align-items: center; gap: 32px; color: #5c665f; font-size: 12px; font-weight: 560; }
    .nav-links a { text-decoration: none; transition: color .2s; }
    .nav-links a:hover { color: var(--green); }
    .nav-actions { display: flex; align-items: center; gap: 15px; }
    .text-button { border: 0; background: none; color: #59635d; padding: 9px 4px; font-weight: 650; font-size: 12px; }
    .text-button:hover { color: var(--green); }
    .button { display: inline-flex; justify-content: center; align-items: center; gap: 10px; border: 1px solid transparent; border-radius: 9px; padding: 13px 18px; min-height: 44px; color: white; background: var(--green); font-size: 12px; font-weight: 700; letter-spacing: -.01em; text-decoration: none; box-shadow: 0 5px 12px rgba(42, 79, 59, .12); transition: transform .18s, background .18s, box-shadow .18s; }
    .button:hover { transform: translateY(-1px); background: var(--green-dark); box-shadow: 0 8px 18px rgba(42, 79, 59, .17); }
    .button:active { transform: translateY(0); }
    .button svg { width: 15px; height: 15px; }
    .button.secondary { background: transparent; border-color: var(--line-dark); color: var(--ink); box-shadow: none; }
    .button.secondary:hover { background: #fffefa; border-color: #b9c5bb; box-shadow: none; }
    .button.small { min-height: 37px; padding: 9px 13px; font-size: 11px; border-radius: 8px; }
    .button.light { background: #fffefa; color: var(--green); box-shadow: none; }
    .button.light:hover { background: #f5f7f2; }
    .button.subtle { background: transparent; color: var(--muted); box-shadow: none; border-color: transparent; }
    .button.subtle:hover { background: var(--paper-deep); color: var(--ink); box-shadow: none; transform: none; }

    /* Landing page */
    .landing { overflow: hidden; }
    .hero-wrap { max-width: 1260px; margin: 0 auto; padding: 66px 38px 53px; }
    .hero-grid { min-height: 475px; display: grid; grid-template-columns: minmax(370px, .92fr) minmax(440px, 1.08fr); align-items: center; gap: clamp(42px, 8vw, 110px); }
    .hero-copy { padding: 15px 0 32px; max-width: 525px; }
    .hero-kicker { display: inline-flex; align-items: center; gap: 9px; border: 1px solid #dce3dc; border-radius: 99px; padding: 7px 11px; color: var(--green); background: rgba(255,255,255,.43); font-size: 10px; text-transform: uppercase; letter-spacing: .12em; font-weight: 750; }
    .kicker-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--apricot); }
    .hero-copy h1 { max-width: 550px; margin: 23px 0 18px; font-family: var(--serif); font-size: clamp(45px, 5.7vw, 74px); line-height: .99; font-weight: 400; letter-spacing: -.065em; }
    .hero-copy h1 em { color: var(--green); font-style: italic; }
    .hero-copy > p { max-width: 445px; margin: 0; color: #657069; font-size: 15px; line-height: 1.78; }
    .hero-actions { display: flex; align-items: center; flex-wrap: wrap; gap: 15px; margin-top: 28px; }
    .hero-actions .button { min-height: 49px; padding: 14px 20px; }
    .hero-note { margin-top: 18px; color: #89918b; font-size: 10px; display: flex; align-items: center; gap: 7px; }
    .hero-note svg { width: 13px; height: 13px; color: var(--green); }
    .hero-art { position: relative; min-height: 420px; display: flex; align-items: center; justify-content: center; }
    .art-wash { position: absolute; width: 83%; height: 78%; right: 0; top: 9%; background: #ebeee7; border-radius: 48% 52% 40% 60% / 51% 42% 58% 49%; transform: rotate(-4deg); }
    .folio-sample { position: relative; width: min(100%, 525px); min-height: 376px; z-index: 1; background: #fffefa; border: 1px solid rgba(49,65,54,.11); border-radius: 12px; box-shadow: 0 24px 62px rgba(32,49,39,.13); transform: rotate(1.5deg); overflow: hidden; }
    .sample-browser { height: 35px; display: flex; align-items: center; gap: 5px; padding: 0 14px; border-bottom: 1px solid #eeeee8; background: rgba(249,248,243,.75); }
    .browser-dot { width: 6px; height: 6px; border-radius: 50%; background: #d4d5cf; }
    .sample-url { margin: 0 auto; color: #9ba19a; font-size: 8px; letter-spacing: .03em; }
    .sample-page { padding: 29px 38px 30px; }
    .sample-topline { display: flex; align-items: center; justify-content: space-between; padding-bottom: 17px; border-bottom: 1px solid #e8e8df; color: #788079; font-size: 8px; letter-spacing: .1em; text-transform: uppercase; }
    .sample-availability { display: flex; align-items: center; gap: 6px; color: var(--green); letter-spacing: .02em; text-transform: none; }
    .sample-availability i { width: 5px; height: 5px; background: #5f906e; border-radius: 50%; }
    .sample-hero { display: grid; grid-template-columns: 1fr 85px; gap: 20px; align-items: center; padding: 28px 0 24px; }
    .sample-hero .eyebrow { font-size: 8px; letter-spacing: .13em; }
    .sample-hero h2 { margin: 8px 0 8px; font-family: var(--serif); font-size: 42px; line-height: .95; letter-spacing: -.06em; font-weight: 400; }
    .sample-hero p { max-width: 300px; margin: 0; color: #68736c; font-size: 10px; line-height: 1.6; }
    .sample-avatar { width: 77px; height: 88px; border-radius: 45% 45% 7px 7px; display: grid; place-items: center; color: #fff; background: #b7c4b5; font-family: var(--serif); font-size: 26px; position: relative; overflow: hidden; }
    .sample-avatar:before { content: ""; position: absolute; inset: 8px 10px 0; border: 1px solid rgba(255,255,255,.48); border-radius: 45% 45% 5px 5px; }
    .sample-facts { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 14px; }
    .sample-facts span { border: 1px solid #e5e7df; border-radius: 99px; padding: 5px 8px; color: #67716a; font-size: 8px; }
    .sample-rule { display: grid; grid-template-columns: 1fr 1fr; gap: 22px; border-top: 1px solid #e8e8df; padding-top: 18px; }
    .sample-rule h3 { margin: 0 0 7px; font-size: 9px; font-weight: 700; }
    .sample-rule p { margin: 0; color: #828981; font-size: 8px; line-height: 1.6; }
    .sample-project { background: #f4f3ec; min-height: 66px; padding: 12px; border-radius: 5px; }
    .sample-project small { display: block; margin-bottom: 5px; color: #9b775d; font-size: 7px; text-transform: uppercase; letter-spacing: .08em; }
    .sample-project strong { font-family: var(--serif); font-size: 12px; font-weight: 400; }
    .float-note { position: absolute; z-index: 2; display: flex; align-items: center; gap: 9px; padding: 11px 13px; border: 1px solid rgba(46,65,52,.09); border-radius: 9px; background: rgba(255,254,250,.94); box-shadow: var(--shadow-soft); color: #5f6962; font-size: 9px; line-height: 1.35; }
    .float-note strong { display: block; color: var(--ink); font-size: 10px; margin-bottom: 2px; }
    .float-icon { width: 25px; height: 25px; display: grid; place-items: center; color: var(--green); background: var(--green-soft); border-radius: 7px; }
    .float-icon svg { width: 14px; height: 14px; }
    .float-note.note-one { left: -23px; bottom: 27px; }
    .float-note.note-two { top: 31px; right: -16px; }
    .float-note.note-two .float-icon { color: var(--apricot); background: var(--apricot-soft); }
    .hero-bottom { display: flex; align-items: center; justify-content: space-between; margin-top: 43px; padding-top: 20px; border-top: 1px solid #e4e5dc; color: #78817a; font-size: 10px; }
    .hero-bottom strong { color: #46524a; font-weight: 650; }
    .mini-avatars { display: flex; align-items: center; }
    .mini-avatars span { width: 23px; height: 23px; margin-left: -5px; display: grid; place-items: center; border: 2px solid var(--paper); border-radius: 50%; background: #d9e2d8; color: #536452; font-size: 8px; font-weight: 700; }
    .mini-avatars span:first-child { margin-left: 0; background: #f0d5c5; color: #795846; }
    .mini-avatars span:nth-child(2) { background: #cbd9d9; color: #4c6765; }
    .mini-avatars span:nth-child(3) { background: #e8dfbd; color: #766943; }
    .social-proof { display: flex; align-items: center; gap: 9px; }
    .social-proof p { margin: 0; }
    .social-proof .stars { color: #b67d47; letter-spacing: 2px; font-size: 11px; }
    .section-pad { padding: 90px 38px; }
    .section-inner { max-width: 1170px; margin: 0 auto; }
    .section-heading { max-width: 570px; margin-bottom: 39px; }
    .section-heading h2 { margin: 11px 0 10px; font-family: var(--serif); font-weight: 400; font-size: clamp(34px, 4vw, 48px); letter-spacing: -.05em; line-height: 1.02; }
    .section-heading p { max-width: 485px; margin: 0; color: var(--muted); font-size: 13px; line-height: 1.7; }
    .how-section { background: #eeefe8; }
    .steps-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
    .landing-step { min-height: 194px; padding: 24px 23px; border: 1px solid rgba(55,78,61,.09); border-radius: 10px; background: rgba(255,254,250,.63); }
    .step-number { width: 29px; height: 29px; display: grid; place-items: center; border-radius: 8px; color: var(--green); background: #e3ece3; font-family: var(--serif); font-size: 15px; }
    .landing-step h3 { margin: 21px 0 8px; font-size: 13px; letter-spacing: -.02em; }
    .landing-step p { max-width: 290px; margin: 0; color: #6e7870; font-size: 11px; line-height: 1.65; }
    .count-section { display: grid; grid-template-columns: .8fr 1.2fr; gap: 75px; align-items: start; }
    .count-section .section-heading { margin: 0; }
    .count-cards { display: grid; grid-template-columns: 1fr 1fr; gap: 13px; }
    .count-card { min-height: 133px; padding: 19px; border: 1px solid var(--line); border-radius: 9px; background: #fffefa; }
    .count-card .count-icon { color: var(--green); font-size: 15px; }
    .count-card h3 { margin: 17px 0 6px; font-size: 11px; }
    .count-card p { margin: 0; color: #7b847d; font-size: 10px; line-height: 1.6; }
    .design-section { background: #f1f0ea; }
    .design-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 17px; }
    .design-card { border: 1px solid #e0e1d9; background: #fffefa; border-radius: 10px; padding: 11px; transition: transform .2s, box-shadow .2s; }
    .design-card:hover { transform: translateY(-3px); box-shadow: var(--shadow-soft); }
    .mini-site { height: 149px; overflow: hidden; padding: 17px; border-radius: 6px; background: #f8f7f2; position: relative; }
    .mini-site:before { content: ""; position: absolute; left: 17px; right: 17px; top: 14px; border-top: 1px solid #e1e1d8; }
    .mini-site .mini-eyebrow { margin-top: 10px; color: var(--green); font-size: 6px; font-weight: 750; letter-spacing: .12em; text-transform: uppercase; }
    .mini-site h4 { margin: 10px 0 6px; color: #2c332e; font-family: var(--serif); font-size: 27px; font-weight: 400; letter-spacing: -.06em; line-height: 1; }
    .mini-site p { max-width: 195px; margin: 0; color: #7d857e; font-size: 7px; line-height: 1.45; }
    .mini-site.minimal { padding-left: 30px; }
    .mini-site.editorial { background: #f4eee8; }
    .mini-site.editorial:after { content: "01"; position: absolute; top: 31px; right: 20px; color: #c67b5f; font-family: var(--serif); font-size: 35px; }
    .mini-site.project { background: #e9eee8; }
    .mini-site.project:after { content: "Selected work"; position: absolute; left: 17px; right: 17px; bottom: 14px; height: 23px; padding: 7px 8px; border-radius: 3px; background: #fffefa; color: #7b827c; font-size: 7px; }
    .design-card-bottom { display: flex; align-items: center; justify-content: space-between; padding: 13px 8px 6px; }
    .design-card-bottom strong { font-size: 11px; }
    .design-card-bottom span { color: #858d86; font-size: 9px; }
    .final-cta { padding: 78px 30px; text-align: center; background: var(--green); color: #f9f8f1; }
    .final-cta .eyebrow { color: #c9dccb; }
    .final-cta h2 { max-width: 570px; margin: 14px auto 12px; font-family: var(--serif); font-size: clamp(38px, 5vw, 56px); line-height: .99; font-weight: 400; letter-spacing: -.055em; }
    .final-cta p { max-width: 390px; margin: 0 auto; color: #d4dfd5; font-size: 12px; line-height: 1.7; }
    .final-cta .button { margin-top: 23px; }
    .footer { min-height: 80px; display: flex; align-items: center; justify-content: space-between; gap: 15px; max-width: 1260px; margin: 0 auto; padding: 20px 38px; color: #818981; font-size: 9px; }
    .footer .logo { font-size: 16px; }
    .footer .logo-mark { width: 20px; height: 20px; border-radius: 6px 6px 6px 2px; }
    .footer .logo-mark svg { width: 12px; height: 12px; }

    /* Editor app */
    .studio { min-height: 100vh; background: #f4f5f1; }
    .studio-bar { height: 64px; position: sticky; top: 0; z-index: 20; display: flex; align-items: center; justify-content: space-between; gap: 15px; padding: 0 25px; border-bottom: 1px solid #e5e8e1; background: rgba(255,255,252,.93); backdrop-filter: blur(14px); }
    .studio-brand { display: flex; align-items: center; gap: 19px; min-width: 210px; }
    .studio-brand .logo { font-size: 18px; }
    .bar-separator { width: 1px; height: 22px; background: var(--line); }
    .draft-label { color: #7b857d; font-size: 10px; }
    .studio-center { display: flex; align-items: center; justify-content: center; gap: 8px; color: #747e76; font-size: 10px; }
    .save-dot { width: 6px; height: 6px; border-radius: 50%; background: #6a9875; }
    .studio-actions { min-width: 230px; display: flex; justify-content: flex-end; align-items: center; gap: 10px; }
    .mobile-switch { display: none; align-items: center; padding: 3px; border: 1px solid #e2e4dd; border-radius: 8px; background: #f7f8f4; }
    .mobile-switch button { min-height: 29px; padding: 6px 10px; border: 0; border-radius: 6px; background: transparent; color: #69736c; font-size: 10px; font-weight: 650; }
    .mobile-switch button.active { background: #fffefa; color: var(--ink); box-shadow: 0 1px 4px rgba(31,42,35,.1); }
    .studio-layout { max-width: 1580px; min-height: calc(100vh - 64px); margin: 0 auto; padding: 24px 24px 32px; display: grid; grid-template-columns: 190px minmax(320px, 440px) minmax(410px, 1fr); align-items: start; gap: 22px; }
    .steps-rail { padding: 17px 6px; position: sticky; top: 84px; }
    .rail-title { margin: 0 0 8px 9px; color: #929a93; font-size: 9px; font-weight: 750; text-transform: uppercase; letter-spacing: .12em; }
    .rail-progress { height: 3px; margin: 12px 9px 20px; border-radius: 99px; background: #e1e5dd; overflow: hidden; }
    .rail-progress span { display: block; height: 100%; border-radius: inherit; background: var(--green); transition: width .25s; }
    .step-list { display: grid; gap: 4px; }
    .rail-step { width: 100%; display: flex; align-items: center; gap: 10px; padding: 10px 9px; border: 0; border-radius: 8px; background: transparent; color: #778078; text-align: left; font-size: 10px; font-weight: 600; transition: background .2s, color .2s; }
    .rail-step:hover { background: #ebeee8; color: var(--ink); }
    .rail-step.active { background: #e7eee7; color: var(--green-dark); }
    .rail-step.done .step-mini-number { color: var(--green); background: #d6e5d8; }
    .step-mini-number { width: 21px; height: 21px; display: grid; place-items: center; flex: 0 0 auto; border-radius: 50%; background: #eceee8; color: #929991; font-size: 9px; font-weight: 750; }
    .rail-tip { margin: 34px 7px 0; padding: 13px; border: 1px solid #e3e6dc; border-radius: 8px; background: rgba(255,255,252,.72); }
    .rail-tip svg { width: 15px; height: 15px; color: var(--apricot); }
    .rail-tip p { margin: 8px 0 0; color: #7a837b; font-size: 9px; line-height: 1.65; }
    .form-panel { min-width: 0; padding: 23px 25px 21px; border: 1px solid #e4e7df; border-radius: 12px; background: #fffefa; box-shadow: 0 7px 22px rgba(42,53,45,.025); }
    .step-overline { display: flex; align-items: center; gap: 8px; color: var(--green); font-size: 9px; font-weight: 750; letter-spacing: .11em; text-transform: uppercase; }
    .step-overline .tiny-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--apricot); }
    .form-panel h1 { margin: 14px 0 8px; font-family: var(--serif); font-size: 34px; line-height: 1.03; letter-spacing: -.055em; font-weight: 400; }
    .step-intro { max-width: 380px; margin: 0 0 22px; color: #7b847d; font-size: 11px; line-height: 1.65; }
    .form-stack { display: grid; gap: 15px; }
    .field { display: grid; gap: 6px; }
    .field label, .field-label { color: #444f47; font-size: 10px; font-weight: 700; }
    .optional { margin-left: 4px; color: #9ba29c; font-size: 9px; font-weight: 450; }
    .field input, .field textarea, .field select { width: 100%; min-height: 39px; border: 1px solid #e2e5dd; border-radius: 7px; outline: none; padding: 10px 11px; color: #344039; background: #fff; font-size: 10px; transition: border .15s, box-shadow .15s; }
    .field input::placeholder, .field textarea::placeholder { color: #b0b6b0; }
    .field input:focus, .field textarea:focus, .field select:focus { border-color: #90a695; box-shadow: 0 0 0 3px rgba(76,119,87,.09); }
    .field textarea { min-height: 86px; resize: vertical; line-height: 1.6; }
    .field textarea.tall { min-height: 112px; }
    .field-help { color: #929b93; font-size: 9px; line-height: 1.5; }
    .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 11px; }
    .helper-box { display: flex; gap: 10px; padding: 12px 12px 12px 11px; border: 1px solid #e1e9df; border-radius: 8px; background: #f2f6ef; color: #6e7e70; font-size: 9px; line-height: 1.55; }
    .helper-box .helper-mark { width: 20px; height: 20px; flex: 0 0 auto; display: grid; place-items: center; border-radius: 6px; background: #e1ebdf; color: var(--green); }
    .helper-mark svg { width: 12px; height: 12px; }
    .helper-box strong { display: block; margin-bottom: 2px; color: #47604c; font-size: 9px; }
    .field-title-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .hint-button { border: 0; padding: 3px 0; background: transparent; color: var(--green); font-size: 9px; font-weight: 700; }
    .hint-button:hover { text-decoration: underline; }
    .chip-entry { display: flex; gap: 7px; }
    .chip-entry input { flex: 1; min-width: 0; }
    .chip-entry button { width: 39px; border: 1px solid #dce3da; border-radius: 7px; background: #f1f5ef; color: var(--green); font-size: 17px; }
    .chip-entry button:hover { background: #e5eee4; }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .chip { display: inline-flex; align-items: center; gap: 6px; padding: 6px 8px 6px 9px; border: 1px solid #e3e7df; border-radius: 99px; background: #f9faf6; color: #66736a; font-size: 9px; }
    .chip button { width: 12px; height: 12px; padding: 0; display: grid; place-items: center; border: 0; background: transparent; color: #9aa39a; line-height: 1; font-size: 13px; }
    .chip button:hover { color: #aa5a43; }
    .empty-note { padding: 17px; border: 1px dashed #dce2d9; border-radius: 8px; background: #fbfcf8; text-align: center; }
    .empty-note .empty-illustration { width: 32px; height: 32px; display: grid; place-items: center; margin: 0 auto 9px; border-radius: 10px; color: var(--green); background: #e9f0e8; }
    .empty-note .empty-illustration svg { width: 16px; height: 16px; }
    .empty-note strong { display: block; color: #526056; font-family: var(--serif); font-size: 16px; font-weight: 400; }
    .empty-note p { max-width: 260px; margin: 5px auto 11px; color: #89938b; font-size: 9px; line-height: 1.55; }
    .project-card { position: relative; padding: 14px; border: 1px solid #e5e7df; border-radius: 8px; background: #fff; }
    .project-card + .project-card { margin-top: 11px; }

    function esc(value) {
      return String(value == null ? '' : value).replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));

    function safeUrl(raw) {
      const value = String(raw || '').trim();
      if (!value) return '';
      const candidate = /^https?:\/\//i.test(value) ? value : `https://${value}`;
      try {
        const url = new URL(candidate);
        if (url.protocol !== 'https:' && url.protocol !== 'http:') return '';
        return url.href;
      } catch (_) { return ''; }
    }
    function initials(name) {
      const parts = String(name || '').trim().split(/\s+/).filter(Boolean);

    function hasSectionContent(key) {

      } else if (key === 'highlights') {
        label = 'Along the way';
        body = `<div class="site-link-list">${p.achievements.map(a => `<a href="#highlights">${esc(a)}</a>`).join('')}</div>`;
      } else if (key === 'contact') {
        label = 'Find me';
        const links = [];
        if (p.email) links.push(`<a href="mailto:${esc(p.email)}">Email me ↗</a>`);
        if (safeUrl(p.github)) links.push(`<a href="${esc(safeUrl(p.github))}" target="_blank" rel="noopener noreferrer">GitHub ↗</a>`);
        if (safeUrl(p.linkedin)) links.push(`<a href="${esc(safeUrl(p.linkedin))}" target="_blank" rel="noopener noreferrer">LinkedIn ↗</a>`);
        body = `<div class="site-link-list">${links.join('')}</div>`;
      }
      return `<section class="site-section" data-section="${key}"><div class="site-section-label">${label}</div><div class="site-section-body">${body}</div></section>`;
    }
    function portfolioMarkup() {
      const p = state.profile;
      const title = p.name ? esc(p.name) : 'Your name';
      const role = p.role ? esc(p.role) : 'What you’re learning or curious about';
      const meta = [p.location, p.degree || p.branch, p.gradYear ? `Class of ${p.gradYear}` : ''].filter(Boolean).slice(0,3);
      const ordered = p.sectionOrder || SECTION_LABELS.map(x => x[0]);
      const sections = ordered.map(siteSection).join('');
      return `<div class="portfolio-site theme-${state.design}">
        <div class="site-nav"><strong>PORTFOLIO</strong><span>${p.name ? esc(p.name.split(' ')[0]) : 'YOUR NAME'}</span></div>
        <header class="site-hero"><div class="site-hero-grid"><div><div class="site-kicker">${p.role ? 'A LITTLE ABOUT ME' : 'YOUR FIRST PORTFOLIO'}</div><h2>${title}</h2><p class="site-headline ${!p.role ? 'site-empty' : ''}">${role}</p></div><div class="site-avatar">${esc(initials(p.name))}</div></div>
          ${meta.length ? `<div class="site-meta">${meta.map(m => `<span>${esc(m)}</span>`).join('')}</div>` : (p.name ? '' : `<div class="site-meta"><span>Your city</span><span>Your course</span></div>`)}
        </header>
        <div class="site-sections">${sections || `<section class="site-section"><div class="site-section-label">Coming together</div><div class="site-section-body"><h3>Your story starts here.</h3><p class="site-empty">Add a few details on the left and your portfolio will take shape.</p></div></section>`}</div>
        <div style="padding-top:14px;color:#9ca39a;font-size:7px;text-align:center">Made with care · folio</div>
      </div>`;
    }
    function builderMarkup() {
      const current = stepHeading();
      const progress = Math.round(((state.step + 1) / STEP_LABELS.length) * 100);
      const isMobilePreview = state.viewport === 'mobile';
      return `
        <div class="studio screen-fade">
          <header class="studio-bar">
            <div class="studio-brand"><a class="logo" href="#" data-action="home"><span class="logo-mark">${icon('leaf', 14)}</span><span>folio</span></a><span class="bar-separator"></span><span class="draft-label">New portfolio</span></div>
            <div class="studio-center"><span id="save-dot" class="save-dot"></span><span id="save-label">${state.saved ? 'Saved on this device' : 'Draft not saved yet'}</span></div>
            <div class="studio-actions">
              <div class="mobile-switch"><button class="${state.mobilePane === 'edit' ? 'active' : ''}" data-action="mobile-edit">Edit</button><button class="${state.mobilePane === 'preview' ? 'active' : ''}" data-action="mobile-preview">Preview</button></div>
              <button class="button subtle small" data-action="home">Save & exit</button>
              <button class="button small" data-action="publish">Publish ${icon('arrow', 12)}</button>
            </div>
          </header>
          <main class="studio-layout ${state.mobilePane === 'preview' ? 'mobile-preview' : ''}">
            <aside class="steps-rail">
              <div class="rail-title">Your portfolio</div><div class="rail-progress"><span style="width:${progress}%"></span></div>
              <nav class="step-list" aria-label="Portfolio setup steps">${STEP_LABELS.map((label, i) => `<button class="rail-step ${state.step === i ? 'active' : ''} ${i < state.step ? 'done' : ''}" data-action="go-step" data-step="${i}"><span class="step-mini-number">${i < state.step ? '✓' : i + 1}</span><span>${label}</span></button>`).join('')}</nav>
              <div class="rail-tip">${icon('light', 14)}<p>You can skip a step and come back later. A first version is allowed to be a work in progress.</p></div>
            </aside>
            <section class="form-panel" aria-label="Portfolio details">
              ${renderStepContent()}
              <div class="form-footer"><button class="button secondary small" data-action="previous" ${state.step === 0 ? 'disabled style="opacity:.45;cursor:default"' : ''}>${icon('arrowLeft', 12)} Back</button><span class="skip-note">${current[1]}</span><button class="button small" data-action="next">${state.step === STEP_LABELS.length - 1 ? 'Done' : 'Continue'} ${icon('arrow', 12)}</button></div>
            </section>
            <aside class="preview-column" aria-label="Live portfolio preview">
              <div class="preview-toolbar"><div class="preview-label"><span class="preview-live-dot"></span> LIVE PREVIEW</div><div class="viewport-switch"><button class="${!isMobilePreview ? 'active' : ''}" aria-label="Desktop preview" data-action="viewport-desktop">${icon('monitor', 14)}</button><button class="${isMobilePreview ? 'active' : ''}" aria-label="Mobile preview" data-action="viewport-mobile">${icon('phone', 14)}</button></div></div>
              <div class="preview-frame ${isMobilePreview ? 'is-mobile' : ''}"><div class="preview-browserbar"><span>${esc(state.profile.name ? state.profile.name.toLowerCase().replace(/\s+/g,'') : 'yourname')}.folio.site</span></div><div id="preview-content" class="preview-content">${portfolioMarkup()}</div></div>
              <div class="preview-tip">${icon('eye', 12)} This is how your site will look on the web.</div>
            </aside>
          </main>
        </div>
        ${state.modal ? publishModal() : ''}`;
    }
    function publishModal() {
      const hasName = !!state.profile.name.trim();
      return `<div class="modal-backdrop" data-action="close-modal"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"><div class="modal-icon">${icon('globe', 18)}</div><h2 id="modal-title">Your first version is taking shape.</h2><p>${hasName ? `You’ve got a draft for <strong>${esc(state.profile.name)}</strong>.` : 'Add your name when you’re ready—your draft will be here.'} The next step will connect your portfolio to an account and a public link.</p><p class="modal-note">This frontend prototype saves your draft only in this browser. Real sign-in and public publishing aren’t connected yet, so nothing is online.</p><div class="modal-actions"><button class="button secondary small" data-action="close-modal">Keep editing</button><button class="button small" data-action="finish-modal">Got it ${icon('check', 12)}</button></div></div></div>`;
    }

    function render() {
      app.innerHTML = state.screen === 'landing' ? landingMarkup() : builderMarkup();
    }
    function updatePreview() {
      const preview = document.getElementById('preview-content');
      if (preview) preview.innerHTML = portfolioMarkup();
      const browserbar = document.querySelector('.preview-browserbar');
      if (browserbar) browserbar.innerHTML = `<span>${esc(state.profile.name ? state.profile.name.toLowerCase().replace(/\s+/g,'') : 'yourname')}.folio.site</span>`;
    }
    function currentField(fieldName, value) {
      state.profile[fieldName] = value;
      persistDraft();
      updatePreview();
    }
    function addChip(fieldName, inputId) {
      const input = document.getElementById(inputId);
      if (!input) return;
      const value = input.value.trim();
      if (!value) { input.focus(); return; }
      const list = state.profile[fieldName];
      if (!list.some(x => x.toLowerCase() === value.toLowerCase())) list.push(value);
      persistDraft(); render();
      const newInput = document.getElementById(inputId);
      if (newInput) newInput.focus();
    }
    function moveStep(n) {
      state.step = Math.max(0, Math.min(STEP_LABELS.length - 1, n));
      state.mobilePane = 'edit';
      render();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }
    function handleAction(button) {
      const action = button.dataset.action;
      if (!action) return;
      if (action === 'start') { state.profile = freshProfile(); state.design = 'minimal'; state.saved = false; goToBuilder(); }
      else if (action === 'resume') { if (state.saved || state.profile.name || state.profile.about) goToBuilder(); else toast('Sign-in will be available when accounts are connected.'); }
      else if (action === 'home') { state.screen = 'landing'; state.modal = false; render(); window.scrollTo(0,0); }
      else if (action === 'next') { if (state.step < STEP_LABELS.length - 1) moveStep(state.step + 1); else { toast('Your design is ready to review.'); state.mobilePane = 'preview'; render(); } }
      else if (action === 'previous') { if (state.step > 0) moveStep(state.step - 1); }
      else if (action === 'go-step') moveStep(Number(button.dataset.step));
      else if (action === 'add-project') { state.profile.projects.push({ id: `p-${Date.now()}-${Math.random().toString(16).slice(2,6)}`, title: '', description: '', tools: '', link: '' }); persistDraft(); render(); const inputs = app.querySelectorAll('[data-project-field="title"]'); if (inputs.length) inputs[inputs.length - 1].focus(); }
      else if (action === 'remove-project') { state.profile.projects = state.profile.projects.filter(p => p.id !== button.dataset.id); persistDraft(); render(); }
      else if (action === 'add-skill') addChip('skills', 'skill-input');
      else if (action === 'add-interest') addChip('interests', 'interest-input');
      else if (action === 'add-achievement') addChip('achievements', 'achievement-input');
      else if (action === 'remove-skill') { state.profile.skills.splice(Number(button.dataset.index), 1); persistDraft(); render(); }
      else if (action === 'remove-interest') { state.profile.interests.splice(Number(button.dataset.index), 1); persistDraft(); render(); }
      else if (action === 'remove-achievement') { state.profile.achievements.splice(Number(button.dataset.index), 1); persistDraft(); render(); }
      else if (action === 'set-design') { state.design = button.dataset.design; persistDraft(); render(); }
      else if (action === 'viewport-desktop') { state.viewport = 'desktop'; render(); }
      else if (action === 'viewport-mobile') { state.viewport = 'mobile'; render(); }
      else if (action === 'mobile-edit') { state.mobilePane = 'edit'; render(); }
      else if (action === 'mobile-preview') { state.mobilePane = 'preview'; render(); }
      else if (action === 'publish') { state.modal = true; render(); }
      else if (action === 'close-modal') { state.modal = false; render(); }
      else if (action === 'finish-modal') { state.modal = false; state.mobilePane = 'preview'; render(); toast('Draft saved on this device. Publishing is not connected yet.'); }
      else if (action === 'writing-help') { toast('Try: “I’m learning ___ and I’m curious about ___.”'); }
      else if (action === 'try-sample') loadExample();
      else if (action === 'reset') resetDraft();
    }

    app.addEventListener('click', event => {
      if (event.target.closest('.modal') && !event.target.closest('.modal [data-action]')) return;
      const actionButton = event.target.closest('[data-action]');
      if (actionButton) { event.preventDefault(); handleAction(actionButton); return; }
      const stepToggle = event.target.closest('[data-section-toggle]');
      if (stepToggle) {
        const key = stepToggle.dataset.sectionToggle;
        state.profile.visible[key] = !state.profile.visible[key];
        persistDraft(); render();
      }
    });
    app.addEventListener('input', event => {
      const target = event.target;
      if (target.dataset.field) currentField(target.dataset.field, target.value);
      if (target.dataset.projectField) {
        const project = state.profile.projects.find(x => x.id === target.dataset.id);
        if (project) { project[target.dataset.projectField] = target.value; persistDraft(); updatePreview(); }
      }
    });
    app.addEventListener('change', event => {
      const target = event.target;
      if (target.dataset.sectionToggle) {
        state.profile.visible[target.dataset.sectionToggle] = !state.profile.visible[target.dataset.sectionToggle];
        persistDraft(); render();
      }
    });
    app.addEventListener('keydown', event => {
      if (event.key === 'Enter' && event.target.matches('[data-skill-input]')) { event.preventDefault(); addChip('skills', 'skill-input'); }
      if (event.key === 'Enter' && event.target.matches('[data-interest-input]')) { event.preventDefault(); addChip('interests', 'interest-input'); }
      if (event.key === 'Enter' && event.target.matches('[data-achievement-input]')) { event.preventDefault(); addChip('achievements', 'achievement-input'); }
      if (event.key === 'Escape' && state.modal) { state.modal = false; render(); }
    });
    render();
  </script>
</body>
</html>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 320" width="100%" height="100%">
  <defs>
    <!-- Dark luxury ambient glow -->
    <radialGradient id="glow" cx="50%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#4f46e5" stop-opacity="0.35"/>
      <stop offset="45%" stop-color="#9333ea" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#090a0f" stop-opacity="0"/>
    </radialGradient>

    <!-- Accent beam gradient -->
    <linearGradient id="beam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0"/>
      <stop offset="35%" stop-color="#60a5fa" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#c084fc" stop-opacity="1"/>
      <stop offset="65%" stop-color="#ec4899" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </linearGradient>

    <!-- Text gradient -->
    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>

    <!-- Subtle circuit grid -->
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1e2433" stroke-width="0.8" opacity="0.6"/>
      <circle cx="0" cy="0" r="1" fill="#334155" opacity="0.8"/>
    </pattern>

    <style>
      @keyframes sweep {
        0% { transform: translateX(-920px); }
        100% { transform: translateX(920px); }
      }
      @keyframes pulse-dot {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.3; transform: scale(0.85); }
      }
      @keyframes float-subtle {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-3px); }
      }
      @keyframes shimmer {
        0% { opacity: 0.4; }
        50% { opacity: 0.85; }
        100% { opacity: 0.4; }
      }
      .beam-sweep {
        animation: sweep 4s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }
      .pulse {
        animation: pulse-dot 2s ease-in-out infinite;
        transform-origin: 52px 42px;
      }
      .shimmer-badge {
        animation: shimmer 3s ease-in-out infinite;
      }
      .floating {
        animation: float-subtle 4s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Base canvas -->
  <rect width="920" height="320" rx="16" fill="#090a0f"/>
  <rect width="920" height="320" rx="16" fill="url(#grid)"/>
  <rect width="920" height="320" rx="16" fill="url(#glow)"/>

  <!-- Top animated laser border -->
  <g clip-path="url(#border-clip)">
    <clipPath id="border-clip">
      <rect width="920" height="320" rx="16"/>
    </clipPath>
    <rect x="0" y="0" width="920" height="1" fill="#1e293b"/>
    <rect class="beam-sweep" x="0" y="0" width="460" height="2" fill="url(#beam)"/>
  </g>

  <!-- Corner tech accents -->
  <path d="M 28 40 L 28 28 L 40 28" fill="none" stroke="#475569" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M 892 40 L 892 28 L 880 28" fill="none" stroke="#475569" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M 28 280 L 28 292 L 40 292" fill="none" stroke="#475569" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M 892 280 L 892 292 L 880 292" fill="none" stroke="#475569" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Status pill -->
  <g transform="translate(48, 36)">
    <rect width="180" height="26" rx="13" fill="#111827" stroke="#1f2937" stroke-width="1"/>
    <circle class="pulse" cx="14" cy="13" r="4.5" fill="#10b981"/>
    <text x="28" y="17" fill="#9ca3af" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'JetBrains Mono', monospace" font-size="11" font-weight="600" letter-spacing="0.5">ENGINE V1.0 // ACTIVE</text>
  </g>

  <!-- Author stamp -->
  <g transform="translate(685, 36)">
    <rect width="187" height="26" rx="13" fill="#131625" stroke="#2e354f" stroke-width="1"/>
    <text x="14" y="17" fill="#a5b4fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'JetBrains Mono', monospace" font-size="11" font-weight="600" letter-spacing="1">CRAFTED BY VARSHUDEV</text>
  </g>

  <!-- Main Title Area -->
  <g class="floating" transform="translate(48, 140)">
    <text x="0" y="0" fill="url(#title-grad)" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'SF Pro Display', Roboto, sans-serif" font-size="56" font-weight="900" letter-spacing="-1.5">
      FOLIO <tspan fill="#6366f1">STUDIO</tspan>
    </text>
    <text x="3" y="32" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="16" font-weight="400" letter-spacing="0.2">
      The Opinionated Developer Portfolio Studio &amp; Zero-Dependency Static Compiler
    </text>
  </g>

  <!-- Bottom Spec Chips -->
  <g transform="translate(48, 240)">
    <!-- Chip 1 -->
    <rect width="155" height="34" rx="8" fill="#111524" stroke="#1f263d" stroke-width="1"/>
    <circle cx="16" cy="17" r="3" fill="#6366f1"/>
    <text x="28" y="21" fill="#cbd5e1" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" font-weight="600">NEXT.JS 16 (TURBO)</text>

    <!-- Chip 2 -->
    <rect x="167" y="0" width="165" height="34" rx="8" fill="#111524" stroke="#1f263d" stroke-width="1"/>
    <circle cx="183" cy="17" r="3" fill="#ec4899"/>
    <text x="195" y="21" fill="#cbd5e1" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" font-weight="600">22 ART DIRECTIONS</text>

    <!-- Chip 3 -->
    <rect x="344" y="0" width="168" height="34" rx="8" fill="#111524" stroke="#1f263d" stroke-width="1"/>
    <circle cx="360" cy="17" r="3" fill="#10b981"/>
    <text x="372" y="21" fill="#cbd5e1" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" font-weight="600">0-COOKIE TELEMETRY</text>

    <!-- Chip 4 -->
    <rect x="524" y="0" width="158" height="34" rx="8" fill="#111524" stroke="#1f263d" stroke-width="1"/>
    <circle cx="540" cy="17" r="3" fill="#f59e0b"/>
    <text x="552" y="21" fill="#cbd5e1" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" font-weight="600">STANDALONE EXPORT</text>

    <!-- Chip 5 -->
    <rect x="694" y="0" width="178" height="34" rx="8" fill="#111524" stroke="#1f263d" stroke-width="1"/>
    <circle cx="710" cy="17" r="3" fill="#06b6d4"/>
    <text x="722" y="21" fill="#cbd5e1" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" font-weight="600">1-CLICK VERCEL REST</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 220" width="100%" height="100%">
  <defs>
    <linearGradient id="flowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>

    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#1f2438"/>
    </pattern>

    <style>
      @keyframes dash {
        to { stroke-dashoffset: -40; }
      }
      @keyframes pulse-node {
        0%, 100% { filter: drop-shadow(0 0 4px rgba(99, 102, 241, 0.4)); }
        50% { filter: drop-shadow(0 0 12px rgba(168, 85, 247, 0.8)); }
      }
      .flowing-wire {
        stroke-dasharray: 6, 6;
        animation: dash 1.4s linear infinite;
      }
      .active-core {
        animation: pulse-node 2.5s ease-in-out infinite;
      }
    </style>
  </defs>

  <rect width="920" height="220" rx="14" fill="#0c0d14" stroke="#1e2337" stroke-width="1"/>
  <rect width="920" height="220" rx="14" fill="url(#dot-grid)"/>

  <!-- Connecting Animated Wires -->
  <path class="flowing-wire" d="M 220 110 L 330 110" stroke="url(#flowGrad)" stroke-width="2.5" fill="none"/>
  <path class="flowing-wire" d="M 570 110 L 680 110" stroke="url(#flowGrad)" stroke-width="2.5" fill="none"/>

  <!-- Section 1: Intake & Authoring -->
  <g transform="translate(30, 40)">
    <rect width="190" height="140" rx="10" fill="#121522" stroke="#252c48" stroke-width="1.5"/>
    <rect x="15" y="15" width="28" height="28" rx="6" fill="#1e2540"/>
    <text x="29" y="34" fill="#60a5fa" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="700" text-anchor="middle">01</text>
    <text x="52" y="34" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="700">CREATOR INTAKE</text>
    
    <text x="15" y="70" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="11">• Studio UI &amp; Live Preview</text>
    <text x="15" y="92" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="11">• Dual Mode: Simple / Advanced</text>
    <text x="15" y="114" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="11">• Gemini Grounded Polishing</text>
    <rect x="15" y="125" width="160" height="2" fill="#3b82f6" opacity="0.6"/>
  </g>

  <!-- Section 2: Core Compilation & Design Engine -->
  <g class="active-core" transform="translate(330, 30)">
    <rect width="240" height="160" rx="12" fill="#14182b" stroke="#6366f1" stroke-width="1.8"/>
    <rect x="18" y="16" width="32" height="32" rx="7" fill="#2d3359"/>
    <text x="34" y="37" fill="#a5b4fc" font-family="'JetBrains Mono', monospace" font-size="15" font-weight="800" text-anchor="middle">02</text>
    <text x="60" y="37" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="800">COMPILER CORE</text>
    
    <text x="18" y="76" fill="#cbd5e1" font-family="'JetBrains Mono', monospace" font-size="11.5">⚡ 22 Art Direction Engines</text>
    <text x="18" y="98" fill="#cbd5e1" font-family="'JetBrains Mono', monospace" font-size="11.5">⚡ GF(2^8) Reed-Solomon QR</text>
    <text x="18" y="120" fill="#cbd5e1" font-family="'JetBrains Mono', monospace" font-size="11.5">⚡ Dynamic next/og Canvas</text>
    <text x="18" y="142" fill="#cbd5e1" font-family="'JetBrains Mono', monospace" font-size="11.5">⚡ Daily-Salted HMAC SHA-256</text>
    <rect x="18" y="152" width="204" height="2" fill="url(#flowGrad)"/>
  </g>

  <!-- Section 3: Distribution & Output -->
  <g transform="translate(680, 40)">
    <rect width="210" height="140" rx="10" fill="#121522" stroke="#252c48" stroke-width="1.5"/>
    <rect x="15" y="15" width="28" height="28" rx="6" fill="#1e2540"/>
    <text x="29" y="34" fill="#ec4899" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="700" text-anchor="middle">03</text>
    <text x="52" y="34" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="700">DISTRIBUTION</text>
    
    <text x="15" y="70" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="11">• 48KB Standalone HTML</text>
    <text x="15" y="92" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="11">• Static Drop ZIP Archive</text>
    <text x="15" y="114" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="11">• Direct Vercel REST Deploy</text>
    <rect x="15" y="125" width="180" height="2" fill="#ec4899" opacity="0.6"/>
  </g>
</svg>

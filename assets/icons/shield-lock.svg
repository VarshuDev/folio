<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <defs>
    <style>
      @keyframes pulse-shield {
        0%, 100% { stroke: #06b6d4; filter: drop-shadow(0 0 2px rgba(6, 182, 212, 0.4)); }
        50% { stroke: #10b981; filter: drop-shadow(0 0 6px rgba(16, 185, 129, 0.8)); }
      }
      .shield { animation: pulse-shield 2s ease-in-out infinite; }
    </style>
  </defs>
  <path class="shield" d="M 12 2 L 20 5.5 C 20 13.5 16 19.5 12 22 C 8 19.5 4 13.5 4 5.5 Z" fill="#0d111d" stroke="#06b6d4" stroke-width="1.8" stroke-linejoin="round"/>
  <!-- Lock loop and body -->
  <rect x="9.5" y="11" width="5" height="4.5" rx="1" fill="#10b981"/>
  <path d="M 10.5 11 L 10.5 9 A 1.5 1.5 0 0 1 13.5 9 L 13.5 11" fill="none" stroke="#10b981" stroke-width="1.2"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <defs>
    <style>
      @keyframes float-box {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-2px); }
      }
      @keyframes emit-doc {
        0%, 100% { transform: translateY(0); opacity: 0.7; }
        50% { transform: translateY(-3px); opacity: 1; }
      }
      .fbox { animation: float-box 2.4s ease-in-out infinite; }
      .fdoc { animation: emit-doc 2s ease-in-out infinite; }
    </style>
  </defs>
  <g class="fbox">
    <polygon points="12,4 21,9 12,14 3,9" fill="#131728" stroke="#6366f1" stroke-width="1.5"/>
    <polygon points="3,9 12,14 12,22 3,17" fill="#0d111d" stroke="#06b6d4" stroke-width="1.5"/>
    <polygon points="12,14 21,9 21,17 12,22" fill="#161b2e" stroke="#8b5cf6" stroke-width="1.5"/>
  </g>
  <!-- Floating Code Sheet Emerging from Box -->
  <g class="fdoc">
    <rect x="8.5" y="4" width="7" height="9" rx="1" fill="#090d16" stroke="#ec4899" stroke-width="1.2"/>
    <line x1="10.5" y1="7" x2="13.5" y2="7" stroke="#ec4899" stroke-width="1" stroke-linecap="round"/>
    <line x1="10.5" y1="9.5" x2="13.5" y2="9.5" stroke="#ec4899" stroke-width="1" stroke-linecap="round"/>
  </g>
</svg>

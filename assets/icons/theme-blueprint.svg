<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <defs>
    <style>
      @keyframes measure-sweep {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(6px); }
      }
      .laser-m { animation: measure-sweep 1.8s ease-in-out infinite; }
    </style>
  </defs>
  <path d="M 4 20 L 20 20 L 4 4 Z" fill="#0c1222" stroke="#06b6d4" stroke-width="1.6" stroke-linejoin="round"/>
  <!-- Ruler notches -->
  <line x1="8" y1="20" x2="8" y2="17" stroke="#06b6d4" stroke-width="1.2"/>
  <line x1="12" y1="20" x2="12" y2="16" stroke="#06b6d4" stroke-width="1.2"/>
  <line x1="16" y1="20" x2="16" y2="17" stroke="#06b6d4" stroke-width="1.2"/>
  <line class="laser-m" x1="4" y1="10" x2="14" y2="20" stroke="#ec4899" stroke-width="1" stroke-dasharray="2, 2"/>
</svg>

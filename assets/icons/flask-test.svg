<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <defs>
    <style>
      @keyframes bubble-up-1 {
        0% { transform: translateY(0); opacity: 0.2; }
        50% { opacity: 1; }
        100% { transform: translateY(-6px); opacity: 0; }
      }
      @keyframes bubble-up-2 {
        0% { transform: translateY(0); opacity: 0.2; }
        50% { opacity: 1; }
        100% { transform: translateY(-8px); opacity: 0; }
      }
      .b1 { animation: bubble-up-1 1.4s ease-in infinite; }
      .b2 { animation: bubble-up-2 1.8s ease-in infinite 0.4s; }
    </style>
  </defs>
  <!-- Flask Body -->
  <path d="M 10 3 L 14 3 L 14 7 L 19.5 18 C 20.2 19.5 19.2 21 17.5 21 L 6.5 21 C 4.8 21 3.8 19.5 4.5 18 L 10 7 Z" fill="#0d111d" stroke="#6366f1" stroke-width="1.6" stroke-linejoin="round"/>
  <!-- Liquid Fill -->
  <path d="M 7 16 L 17 16 L 18.5 19 C 18.8 19.8 18.2 20 17.5 20 L 6.5 20 C 5.8 20 5.2 19.8 5.5 19 Z" fill="#ec4899" opacity="0.6"/>
  <!-- Reagent Bubbles -->
  <circle class="b1" cx="10" cy="16" r="1.5" fill="#38bdf8"/>
  <circle class="b2" cx="14" cy="17" r="1.2" fill="#ffffff"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <defs>
    <style>
      @keyframes float-rock {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-2px); }
      }
      @keyframes exhaust {
        0%, 100% { transform: scaleY(0.7); opacity: 0.5; }
        50% { transform: scaleY(1.3); opacity: 1; }
      }
      .rocket { animation: float-rock 2s ease-in-out infinite; }
      .fire { animation: exhaust 0.8s ease-in-out infinite; transform-origin: 12px 19px; }
    </style>
  </defs>
  <g class="rocket">
    <!-- Rocket Body -->
    <path d="M 12 2 C 8 7 8 13 8 16 L 16 16 C 16 13 16 7 12 2 Z" fill="#0d111d" stroke="#6366f1" stroke-width="1.6"/>
    <!-- Fins -->
    <path d="M 8 13 L 4 16 L 8 16" fill="#131728" stroke="#06b6d4" stroke-width="1.2"/>
    <path d="M 16 13 L 20 16 L 16 16" fill="#131728" stroke="#06b6d4" stroke-width="1.2"/>
    <!-- Porthole -->
    <circle cx="12" cy="9" r="2" fill="#06b6d4"/>
  </g>
  <!-- Exhaust Flame -->
  <path class="fire" d="M 10 17 L 12 22 L 14 17 Z" fill="#ec4899"/>
</svg>

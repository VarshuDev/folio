<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <defs>
    <style>
      @keyframes spin-node {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes pulse-core {
        0%, 100% { fill: #06b6d4; filter: drop-shadow(0 0 2px rgba(6, 182, 212, 0.6)); }
        50% { fill: #ec4899; filter: drop-shadow(0 0 6px rgba(236, 72, 153, 0.9)); }
      }
      .spin-net {
        animation: spin-node 8s linear infinite;
        transform-origin: 12px 12px;
      }
      .pcore {
        animation: pulse-core 1.8s ease-in-out infinite;
      }
    </style>
  </defs>
  <g class="spin-net">
    <circle cx="12" cy="4" r="2.2" fill="#6366f1"/>
    <circle cx="19" cy="8" r="2.2" fill="#6366f1"/>
    <circle cx="19" cy="16" r="2.2" fill="#6366f1"/>
    <circle cx="12" cy="20" r="2.2" fill="#6366f1"/>
    <circle cx="5" cy="16" r="2.2" fill="#6366f1"/>
    <circle cx="5" cy="8" r="2.2" fill="#6366f1"/>
    <polygon points="12,4 19,8 19,16 12,20 5,16 5,8" fill="none" stroke="#334155" stroke-width="1.2" stroke-dasharray="3, 2"/>
  </g>
  <circle class="pcore" cx="12" cy="12" r="3"/>
</svg>

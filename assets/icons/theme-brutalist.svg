<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <defs>
    <style>
      @keyframes brutal-shake {
        0%, 100% { transform: translate(0, 0); }
        50% { transform: translate(-1px, -1px); }
      }
      .bblock { animation: brutal-shake 1.6s ease-in-out infinite; }
    </style>
  </defs>
  <!-- Hard Black Offset Drop Shadow -->
  <rect x="7" y="7" width="14" height="14" fill="#ff2a5f"/>
  <!-- Top Block -->
  <g class="bblock">
    <rect x="3" y="3" width="14" height="14" fill="#ffffff" stroke="#000000" stroke-width="2"/>
    <rect x="6" y="6" width="8" height="8" fill="#000000"/>
  </g>
</svg>
